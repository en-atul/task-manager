apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskmanager-chart.fullname" . }}-pg-secrets
  labels:
    {{- include "taskmanager-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-7"
type: Opaque
data:
  db_username: {{ .Values.database.username | b64enc }}
  db_password: {{ .Values.database.password | b64enc }} 