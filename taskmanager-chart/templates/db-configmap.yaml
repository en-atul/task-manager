apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskmanager-chart.fullname" . }}-db-config
  labels:
    {{- include "taskmanager-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
data:
  db_name: {{ .Values.database.name | default "task-manager" }}
  db_host: {{ .Values.database.host | default (printf "%s-postgres" (include "taskmanager-chart.fullname" .)) }}
  db_ssl_mode: {{ .Values.database.sslMode | default "disable" }}
  db_channel_binding: {{ .Values.database.channelBinding | default "disable" }} 